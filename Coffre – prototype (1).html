<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffre – prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --floor:#2a2140; --floor-line:#34295080; --gold:#ffcc33; --gold-dark:#c98a12;
    --steel:#d7dde6; --wood:#a0643b; --lock:#8b7bb5; --live:#3fbf7f; --ink:#f6f0ff;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --floor:#2a2140; } }
  :root[data-theme="dark"]{ --floor:#2a2140; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{ height:100%; margin:0; background:var(--floor); overflow:hidden;
        font-family:"Press Start 2P", "Courier New", monospace; color:var(--ink);
        -webkit-user-select:none; user-select:none; }
  canvas{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #hud{ position:fixed; top:50%; left:0; right:0; padding-top:12px;
        display:flex; justify-content:center; pointer-events:none; }
  #wallet{ display:flex; align-items:center; gap:10px; background:#00000055; border:3px solid var(--gold-dark);
           padding:10px 16px; font-size:16px; image-rendering:pixelated; }
  #wallet i{ width:16px; height:16px; background:var(--gold); border:3px solid var(--gold-dark); border-radius:50%; display:inline-block; }
  #hint{ position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom,0px)); text-align:center; font-size:11px; line-height:1.8;
         color:var(--ink); opacity:.85; pointer-events:none; transition:opacity .6s; padding:0 20px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none"><div id="wallet"><i></i><span id="count">0</span></div></div>
<div id="hint">Carré de gauche : 20 billes = canon auto, 20 de plus = cadence x2<br>Carré de droite : charge ton canon</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const countEl = document.getElementById('count'), hint = document.getElementById('hint');
let W, H, dpr, TOP;
const shovel = { x: 0, y: 0, tx: 0, ty: 0, angle: 0 };
const anchor = { x: 0, y: 0 }; let aimAngle = 0; // orientation : direction prise sur les 10 derniers pixels parcourus
let coins = [], zones = [], floaters = [], enemies = [], bullets = [], sparks = [], t = 0, moved = false;
let wave = 0, waveQueue = [], wavePause = 2, banner = 0;
let ammo = 0, hp = 10, score = 0, best = 0, dropClock = 0, enemyClock = 0, fireClock = 0, lostFlash = 0;
// paliers du canon auto : niveau 1 = débloqué (1 tir/s), niveau 2 = cadence x2 (2 tirs/s)
const AUTO_COSTS = [20, 20], AUTO_DELAYS = [1, 0.5];
// canons[0] = canon automatique (gauche, à débloquer), canons[1] = canon alimenté par les billes (droite)
const cannons = [
  { auto: true, active: false, level: 0, angle: -Math.PI / 2, recoil: 0, clock: 0, x: 0 },
  { auto: false, active: true, angle: -Math.PI / 2, recoil: 0, clock: 0, x: 0 }
];
const K = 0.6; // échelle générale
const R = 10 * K, THICK = 5 * K, MAX_COINS = 250, MAX_FLOOR = 60;
const ENEMY_R = 7, BULLET_SPEED = 560, FIRE_DELAY = 0.16, HP_MAX = 10;

// pelle en forme de « { » (creux vers l'avant, axe +x)
function quad(a, c, b, n = 8){ const o = []; for (let i = 1; i <= n; i++){ const u = i / n;
  o.push([(1-u)*(1-u)*a[0] + 2*(1-u)*u*c[0] + u*u*b[0], (1-u)*(1-u)*a[1] + 2*(1-u)*u*c[1] + u*u*b[1]]); } return o; }
const SHAPE = [[40, -45], ...quad([40,-45],[6,-45],[6,-21]), [6, -9], ...quad([6,-9],[6,0],[-12,0],4),
  ...quad([-12,0],[6,0],[6,9],4), [6, 21], ...quad([6,21],[6,45],[40,45])].map(([x, y]) => [x * K, y * K]);

function layout(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  TOP = Math.round(H / 2); document.getElementById('hud').style.top = TOP + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // les deux carrés côte à côte, au centre, collés sous la ligne de front
  const s = Math.min(110 * K, W * 0.2), gap = s * 0.4, bottom = TOP + 16;
  const xs = [W / 2 - gap / 2 - s, W / 2 + gap / 2];
  if (!zones.length) zones = xs.map((x, i) => ({ x, y: bottom, s, flash: 0, kind: i === 0 ? 'unlock' : 'ammo', paid: 0 }));
  else zones.forEach((z, i) => { z.x = xs[i]; z.y = bottom; z.s = s; });
  zones.forEach((z, i) => { cannons[i].x = z.x + z.s / 2; }); // chaque canon juste au-dessus de son carré
}

function spawnCoin(x, y, vx = 0, vy = 0, z = 0){ if (coins.length < MAX_COINS) coins.push({ x, y, vx, vy, z, vz: 0 }); }
function inZone(x, y, pad = 0){ return zones.some(z => x > z.x - pad && x < z.x + z.s + pad && y > z.y - pad && y < z.y + z.s + pad); }
function dropCoin(){ // une bille tombe du haut à un endroit aléatoire de la moitié basse
  for (let k = 0; k < 20; k++){
    // bande du milieu de la moitié basse : ni collée à la ligne, ni tout en bas (zone difficile à atteindre au doigt)
    const x = R + 10 + Math.random() * (W - 2 * R - 20), y = TOP + 40 + Math.random() * ((H - TOP) * 0.68 - 40);
    if (!inZone(x, y, R + 40)){ spawnCoin(x, y, 0, 0, y - TOP + 20); return; } // tombe autour des carrés, jamais au centre
  }
}

function init(){
  layout();
  shovel.x = shovel.tx = anchor.x = W / 2; shovel.y = shovel.ty = anchor.y = TOP + (H - TOP) * 0.45;
  for (let n = 0; n < 10; n++) dropCoin();
  coins.forEach(c => { c.z = 0; });
}

// contrôle : la pelle suit la souris (sans clic) ou le doigt
const keys = {}, SPEED = 220, FINGER_OFFSET = 75; // sur mobile la pelle se place au-dessus du doigt pour rester visible
function follow(e){
  shovel.tx = e.clientX; shovel.ty = e.clientY - (e.pointerType === 'mouse' ? 0 : FINGER_OFFSET);
  if (!moved){ moved = true; hint.style.opacity = 0; }
}
cv.addEventListener('pointerdown', follow);
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) follow(e); });
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (!moved){ moved = true; hint.style.opacity = 0; } });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('resize', layout);
function keyMove(dt){
  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['q'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['z'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;
  const d = Math.hypot(dx, dy); if (!d) return;
  shovel.tx += dx / d * SPEED * dt; shovel.ty += dy / d * SPEED * dt;
}

function worldShape(){
  const c = Math.cos(shovel.angle), sn = Math.sin(shovel.angle);
  return SHAPE.map(([x, y]) => [shovel.x + x * c - y * sn, shovel.y + x * sn + y * c]);
}
function pushOut(pts){
  for (const cn of coins){
    if (cn.z > 0 || Math.abs(cn.x - shovel.x) > 90 || Math.abs(cn.y - shovel.y) > 90) continue;
    for (let i = 0; i < pts.length - 1; i++){
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy || 1;
      let u = ((cn.x - ax) * dx + (cn.y - ay) * dy) / L; u = Math.max(0, Math.min(1, u));
      const px = ax + dx * u, py = ay + dy * u;
      let nx = cn.x - px, ny = cn.y - py, d = Math.hypot(nx, ny);
      const min = R + THICK;
      if (d < min){
        if (d < 0.001){ nx = -dy; ny = dx; d = Math.hypot(nx, ny); }
        cn.x = px + nx / d * min; cn.y = py + ny / d * min;
      }
    }
  }
}
// les billes déjà dans le creux de la pelle n'en ressortent que par l'avant (évite qu'elles traversent les parois fines)
const CUP_X0 = 6 * K + R + THICK, CUP_X1 = 40 * K, CUP_Y = 45 * K - R - THICK;
function markInside(){
  const c = Math.cos(shovel.angle), sn = Math.sin(shovel.angle);
  for (const b of coins){
    const dx = b.x - shovel.x, dy = b.y - shovel.y, lx = dx * c + dy * sn, ly = -dx * sn + dy * c;
    b.inCup = b.z <= 0 && lx > 0 && lx < CUP_X1 && Math.abs(ly) < 45 * K;
  }
}
function keepInside(){
  const c = Math.cos(shovel.angle), sn = Math.sin(shovel.angle);
  for (const b of coins){
    if (!b.inCup) continue;
    const dx = b.x - shovel.x, dy = b.y - shovel.y;
    let lx = dx * c + dy * sn, ly = -dx * sn + dy * c;
    if (lx > CUP_X1){ b.inCup = false; continue; } // sortie par l'avant : autorisée
    lx = Math.max(CUP_X0, lx); ly = Math.max(-CUP_Y, Math.min(CUP_Y, ly));
    b.x = shovel.x + lx * c - ly * sn; b.y = shovel.y + lx * sn + ly * c;
  }
}
function coinCollisions(passes = 2){
  for (let k = 0; k < passes; k++)
    for (let i = 0; i < coins.length; i++) for (let j = i + 1; j < coins.length; j++){
      const a = coins[i], b = coins[j]; if (a.z > 0 || b.z > 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 < 4 * R * R && d2 > 0.0001){
        const d = Math.sqrt(d2), o = (2 * R - d) / 2, nx = dx / d, ny = dy / d;
        a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
      }
    }
}
function angleTo(a, b){ let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function burst(x, y, color, n = 10){
  for (let i = 0; i < n; i++){ const a = Math.random() * 7, v = 60 + Math.random() * 120;
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.3, color }); }
}

function update(dt){
  t += dt;
  // --- moitié basse : pelle et billes ---
  keyMove(dt);
  shovel.tx = Math.max(20, Math.min(W - 20, shovel.tx)); shovel.ty = Math.max(TOP + 20, Math.min(H - 20, shovel.ty));
  const nx = shovel.x + (shovel.tx - shovel.x) * Math.min(1, dt * 18);
  const ny = shovel.y + (shovel.ty - shovel.y) * Math.min(1, dt * 18);
  const mvx = nx - shovel.x, mvy = ny - shovel.y, dist = Math.hypot(mvx, mvy);
  // orientation : on ne regarde la direction qu'après 10 px parcourus (filtre les tremblements),
  // puis la pelle tourne vite vers cette direction (virages serrés et demi-tours possibles)
  const ax = nx - anchor.x, ay = ny - anchor.y;
  if (Math.hypot(ax, ay) > 10){ aimAngle = Math.atan2(ay, ax); anchor.x = nx; anchor.y = ny; }
  const dAng = angleTo(shovel.angle, aimAngle) * Math.min(1, dt * 16);
  const steps = Math.max(1, Math.ceil(Math.max(dist / 3, Math.abs(dAng) / 0.05)));
  markInside();
  for (let s = 0; s < steps; s++){
    shovel.x += mvx / steps; shovel.y += mvy / steps; shovel.angle += dAng / steps;
    pushOut(worldShape());
    if (s % 3 === 2) coinCollisions(1);
    keepInside();
  }
  for (const c of coins){
    c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.9; c.vy *= 0.9;
    if (c.z > 0 || c.vz !== 0){
      c.vz += 2200 * dt; c.z -= c.vz * dt;
      if (c.z <= 0){ c.z = 0; c.vz = c.vz > 300 ? -c.vz * 0.3 : 0; }
    }
  }
  const ws = worldShape();
  for (let k = 0; k < 4; k++){ coinCollisions(1); pushOut(ws); keepInside(); }
  for (const c of coins){ c.x = Math.max(R, Math.min(W - R, c.x)); c.y = Math.max(TOP + R + 4, Math.min(H - R - 6, c.y)); }

  // billes qui tombent automatiquement
  dropClock += dt;
  if (dropClock > 0.45){ dropClock = 0; if (coins.length < MAX_FLOOR) dropCoin(); }

  // une bille poussée dans un carré = une munition pour le canon
  for (let i = coins.length - 1; i >= 0; i--){
    const c = coins[i];
    if (c.z > 0) continue;
    const z = zones.find(z => !(z.kind === 'unlock' && cannons[0].level >= AUTO_COSTS.length) && c.x > z.x && c.x < z.x + z.s && c.y > z.y && c.y < z.y + z.s);
    if (!z) continue;
    coins.splice(i, 1); z.flash = 0.15;
    if (z.kind === 'ammo'){ ammo++; floaters.push({ x: c.x, y: c.y, txt: '+1', life: 0.6 }); }
    else {
      const cn = cannons[0], cost = AUTO_COSTS[cn.level];
      z.paid++; floaters.push({ x: c.x, y: c.y, txt: z.paid + '/' + cost, life: 0.6 });
      if (z.paid >= cost){
        z.paid = 0; cn.level++; cn.active = true; cn.recoil = 8;
        burst(cn.x, TOP - 6, '#ffcc33', 30); burst(z.x + z.s / 2, z.y + z.s / 2, '#3fbf7f', 24);
        floaters.push({ x: cn.x, y: TOP - 30, txt: cn.level === 1 ? 'CANON AUTO !' : 'CADENCE x2 !', life: 1.6 });
      }
    }
  }
  zones.forEach(z => z.flash = Math.max(0, z.flash - dt));

  // --- moitié haute : points rouges et canon ---
  // vagues : une armée de points rouges qui avance en rangs
  if (!waveQueue.length && !enemies.length){
    wavePause -= dt;
    if (wavePause <= 0){
      wave++; banner = 1.6; wavePause = Math.max(0.6, 2.5 - wave * 0.2);
      const perRow = Math.min(9, 4 + Math.floor(wave / 2)), rows = 2 + wave, speed = 20 * Math.pow(1.15, wave - 1);
      const gap = Math.max(0.35, 1.1 * Math.pow(0.9, wave - 1)); // les rangs arrivent de plus en plus serrés
      for (let r = 0; r < rows; r++){
        const shape = r % 3; // alternance : rang plein, rang en V, rang serré
        for (let i = 0; i < perRow; i++){
          const fx = (i + 0.5) / perRow;
          const x = shape === 2 ? W * (0.3 + fx * 0.4) : 16 + fx * (W - 32);
          const dy = shape === 1 ? Math.abs(i - (perRow - 1) / 2) * 6 : 0;
          waveQueue.push({ at: r * gap, x: x + (Math.random() - 0.5) * 6, dy, v: speed });
        }
      }
      enemyClock = 0;
    }
  }
  if (waveQueue.length){
    enemyClock += dt;
    while (waveQueue.length && waveQueue[0].at <= enemyClock){
      const q = waveQueue.shift(); enemies.push({ x: q.x, y: -ENEMY_R - q.dy, v: q.v });
    }
  }
  banner = Math.max(0, banner - dt);
  enemies.forEach(e => e.y += e.v * dt);
  for (let i = enemies.length - 1; i >= 0; i--){
    if (enemies[i].y > TOP - 14){ burst(enemies[i].x, TOP - 14, '#ff4d5e', 8); enemies.splice(i, 1); hp--; lostFlash = 0.3; }
  }
  if (hp <= 0){ best = Math.max(best, score); score = 0; hp = HP_MAX; enemies = []; bullets = []; waveQueue = []; wave = 0; wavePause = 2.5; lostFlash = 1; }
  lostFlash = Math.max(0, lostFlash - dt);

  const cy = TOP - 6;
  for (const cn of cannons){
    cn.recoil = Math.max(0, cn.recoil - dt * 40);
    if (!cn.active) continue;
    const cx = cn.x;
    let target = null, bestY = -1;
    for (const e of enemies) if (!e.locked && e.y > bestY){ bestY = e.y; target = e; } // vise le plus avancé pas encore visé
    if (target) cn.angle += angleTo(cn.angle, Math.atan2(target.y - cy, target.x - cx)) * Math.min(1, dt * 12);
    cn.clock += dt;
    const ready = cn.auto ? cn.clock > AUTO_DELAYS[cn.level - 1] : (ammo > 0 && cn.clock > FIRE_DELAY);
    if (target && ready){
      cn.clock = 0; cn.recoil = 6; if (!cn.auto) ammo--;
      // tir avec anticipation de la chute de la cible
      const d = Math.hypot(target.x - cx, target.y - cy), tt = d / BULLET_SPEED;
      const a = Math.atan2(target.y + target.v * tt - cy, target.x - cx);
      target.locked = true;
      bullets.push({ target, x: cx + Math.cos(a) * 20, y: cy + Math.sin(a) * 20, vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED });
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
    let hit = -1;
    for (let j = 0; j < enemies.length; j++) if (Math.hypot(enemies[j].x - b.x, enemies[j].y - b.y) < ENEMY_R + 4){ hit = j; break; }
    if (hit >= 0){ if (b.target && b.target !== enemies[hit]) b.target.locked = false; burst(enemies[hit].x, enemies[hit].y, '#ffcc33'); enemies.splice(hit, 1); bullets.splice(i, 1); score++; continue; }
    if (b.y < -20 || b.x < -20 || b.x > W + 20){ if (b.target) b.target.locked = false; bullets.splice(i, 1); }
  }

  sparks.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; });
  sparks = sparks.filter(p => p.life > 0);
  floaters.forEach(f => { f.life -= dt; f.y -= 40 * dt; });
  floaters = floaters.filter(f => f.life > 0);
  countEl.textContent = ammo;
}

function drawCoin(x, y, r){
  ctx.fillStyle = '#c98a12'; ctx.beginPath(); ctx.arc(x, y + 2, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3b0'; ctx.fillRect(x - r * 0.45, y - r * 0.5, r * 0.35, r * 0.35);
}
function drawShovel(){
  const pts = worldShape();
  const path = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // ombre portée, contour sombre, métal, reflet : la pelle ressort sur le sol et au milieu des billes
  ctx.save(); ctx.translate(0, 4); path(); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = THICK * 2 + 4; ctx.stroke(); ctx.restore();
  path(); ctx.strokeStyle = '#0e0a1c'; ctx.lineWidth = THICK * 2 + 4; ctx.stroke();
  path(); ctx.strokeStyle = '#7ee0ff'; ctx.lineWidth = THICK * 2; ctx.stroke();
  path(); ctx.strokeStyle = '#e8fbff'; ctx.lineWidth = Math.max(1, THICK * 0.6); ctx.stroke();
}
function drawZone(z){
  const { x, y, s } = z;
  const lvl = cannons[0].level, maxed = z.kind === 'unlock' && lvl >= AUTO_COSTS.length;
  const col = z.kind === 'unlock' ? (maxed ? '#3fbf7f' : '#8b7bb5') : '#ffcc33';
  ctx.fillStyle = z.flash > 0 ? col + '55' : col + '18'; ctx.fillRect(x, y, s, s);
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(x, y, s, s);
  ctx.textAlign = 'center';
  if (z.kind === 'unlock' && !maxed){
    // jauge de paiement
    const cost = AUTO_COSTS[lvl], k = z.paid / cost;
    ctx.fillStyle = '#3fbf7f66'; ctx.fillRect(x + 3, y + s - 3 - (s - 6) * k, s - 6, (s - 6) * k);
    const lx = x + s / 2, ly = y + s * 0.38;
    if (lvl === 0){ // cadenas
      ctx.strokeStyle = '#d7dde6'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(lx, ly - 2, 6, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#d7dde6'; ctx.fillRect(lx - 9, ly - 2, 18, 13);
    } else { // amélioration
      ctx.fillStyle = '#f6f0ff'; ctx.font = '10px "Press Start 2P", monospace'; ctx.fillText('x2', lx, ly + 8);
    }
    ctx.fillStyle = '#f6f0ff'; ctx.font = '8px "Press Start 2P", monospace';
    ctx.fillText(z.paid + '/' + cost, x + s / 2, y + s * 0.82);
  } else if (maxed){
    ctx.fillStyle = '#3fbf7f'; ctx.font = '8px "Press Start 2P", monospace';
    ctx.fillText('MAX', x + s / 2, y + s * 0.45); ctx.fillText('2/s', x + s / 2, y + s * 0.65);
  } else {
    // flèche vers le canon
    ctx.fillStyle = '#ffcc33aa'; ctx.beginPath();
    ctx.moveTo(x + s / 2, y + s * 0.25); ctx.lineTo(x + s * 0.7, y + s * 0.5); ctx.lineTo(x + s * 0.3, y + s * 0.5); ctx.fill();
    ctx.fillRect(x + s * 0.44, y + s * 0.5, s * 0.12, s * 0.22);
  }
  ctx.textAlign = 'left';
}
function drawCannon(cn){
  const cx = cn.x, cy = TOP - 6;
  ctx.globalAlpha = cn.active ? 1 : 0.3;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(cn.angle);
  ctx.fillStyle = cn.auto ? '#7fd1a8' : '#9aa3b2'; ctx.fillRect(-cn.recoil, -6, 30 - cn.recoil, 12);
  ctx.fillStyle = cn.auto ? '#3fbf7f' : '#6b7383'; ctx.fillRect(24 - cn.recoil, -8, 8, 16);
  ctx.restore();
  ctx.fillStyle = '#4a5160'; ctx.beginPath(); ctx.arc(cx, cy + 6, 18, Math.PI, 0); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.font = '9px "Press Start 2P", monospace'; ctx.textAlign = 'center';
  if (!cn.active){ ctx.fillStyle = '#8b7bb5'; ctx.fillText('verrouillé', cx, cy - 26); }
  else if (cn.auto){ ctx.fillStyle = '#3fbf7f'; ctx.fillText(cn.level >= 2 ? 'auto 2/s' : 'auto 1/s', cx, cy - 26); }
  else {
    // stock de munitions, à gauche du canon
    ctx.fillStyle = '#00000066'; ctx.fillRect(cx + 26, cy - 20, 62, 22);
    drawCoin(cx + 38, cy - 9, 6);
    ctx.fillStyle = ammo > 0 ? '#ffcc33' : '#ff4d5e'; ctx.font = '11px "Press Start 2P", monospace'; ctx.textAlign = 'left';
    ctx.fillText(ammo, cx + 50, cy - 3);
  }
  ctx.textAlign = 'left';
}
function draw(){
  // moitié haute
  ctx.fillStyle = lostFlash > 0 ? '#3a1024' : '#17122a'; ctx.fillRect(0, 0, W, TOP);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, TOP); ctx.clip();
  for (const e of enemies){
    ctx.fillStyle = '#7a1522'; ctx.beginPath(); ctx.arc(e.x, e.y + 2, ENEMY_R, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff4d5e'; ctx.beginPath(); ctx.arc(e.x, e.y, ENEMY_R, 0, 7); ctx.fill();
  }
  for (const b of bullets) drawCoin(b.x, b.y, 4);
  ctx.restore();
  // infos haut
  ctx.textAlign = 'left'; ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#f6f0ff';
  const top = 16 + (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0);
  ctx.fillText('Vague ' + wave + '   Score ' + score + (best ? '   Record ' + best : ''), 12, top);
  if (banner > 0){
    ctx.globalAlpha = Math.min(1, banner * 2); ctx.textAlign = 'center'; ctx.font = '16px "Press Start 2P", monospace';
    ctx.fillStyle = '#ff4d5e'; ctx.fillText('VAGUE ' + wave, W / 2, TOP * 0.45); ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.font = '9px "Press Start 2P", monospace';
  }
  for (let i = 0; i < HP_MAX; i++){ ctx.fillStyle = i < hp ? '#3fbf7f' : '#3a3050'; ctx.fillRect(12 + i * 12, top + 10, 9, 6); }

  // moitié basse
  ctx.save(); ctx.beginPath(); ctx.rect(0, TOP, W, H - TOP); ctx.clip();
  ctx.fillStyle = '#2a2140'; ctx.fillRect(0, TOP, W, H - TOP);
  ctx.fillStyle = '#342950';
  for (let gx = 0; gx < W; gx += 48) for (let gy = 0; gy < H; gy += 48) if ((gx + gy) / 48 % 2 === 0) ctx.fillRect(gx, gy, 48, 48);
  zones.forEach(drawZone);
  for (const c of coins){
    if (c.z > 0){
      const k = Math.max(0.3, 1 - c.z / 400);
      ctx.fillStyle = 'rgba(0,0,0,' + (0.35 * k) + ')';
      ctx.beginPath(); ctx.ellipse(c.x, c.y + 3, R * k, R * 0.5 * k, 0, 0, 7); ctx.fill();
    }
    drawCoin(c.x, c.y - c.z, R);
  }
  drawShovel();
  ctx.restore();

  for (const p of sparks){ ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.textAlign = 'center'; ctx.font = '9px "Press Start 2P", monospace';
  floaters.forEach(f => { ctx.globalAlpha = Math.max(0, f.life * 1.5); ctx.fillStyle = '#ffcc33'; ctx.fillText(f.txt, f.x, f.y - 12); });
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#c98a12'; ctx.fillRect(0, TOP - 2, W, 4); // séparation
  cannons.forEach(drawCannon);
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
init(); requestAnimationFrame(loop);
</script>
</body>
</html>
